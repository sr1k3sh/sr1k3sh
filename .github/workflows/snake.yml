name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#003893&color_dots=#ebedf0,#f7b6c2,#ee6f86,#e33a58,#DC143C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4a7fd6&color_dots=#161b22,#5c0f1e,#8f1228,#c0122f,#DC143C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
